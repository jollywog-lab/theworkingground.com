function useTrackerData() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);

        MATURITY_SHORT: themeData.maturityShort,
        REGS: regData.regulations,

// ============================================================
// HELPERS
// ============================================================
function buildMatrix(countries, themes, regs) {
  const m = {};
  countries.forEach(c => {
    m[c.code] = {};
    themes.forEach(t => {
      m[c.code][t.code] = {
        maturity: 0,
        regs: [],
        hasNew: false
      };
    });
  });
  regs.forEach(r => {
    const cell = m[r.country]?.[r.theme];
    if (!cell) return;
    cell.regs.push(r);
    if (r.maturity > cell.maturity) cell.maturity = r.maturity;
    if (r.isNew) cell.hasNew = true;
  });
  return m;
}
